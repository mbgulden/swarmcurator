[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "swarmcurator"
version = "0.1.0"
description = "Universal task admission, priority aging, and lane-locking queue primitive for AI agent swarms."
readme = "README.md"
authors = [{ name = "Michael Gulden", email = "mbgulden@gmail.com" }]
license = "MIT"
requires-python = ">=3.10"
keywords = ["task-queue", "priority-aging", "lane-locking", "linear", "github", "swarm", "agent", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
fastapi = ["fastapi>=0.100"]

[project.scripts]
swarmcurator = "swarmcurator.cli:main"

[project.urls]
Homepage = "https://github.com/mbgulden/swarmcurator"
Repository = "https://github.com/mbgulden/swarmcurator.git"
Changelog = "https://github.com/mbgulden/swarmcurator/blob/main/CHANGELOG.md"

[tool.setuptools.package-data]
swarmcurator = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
