[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "swarmcurator"
version = "0.4.0"
description = "Universal task admission, priority aging, lane-locking, and crash-recovery queue primitive for AI agent swarms."
readme = "README.md"
authors = [{ name = "Michael Gulden", email = "mbgulden@gmail.com" }]
license = "MIT"
requires-python = ">=3.10"
keywords = ["task-queue", "priority-aging", "lane-locking", "crash-recovery", "linear", "github", "swarm", "agent", "fastapi"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
fastapi = ["fastapi>=0.100"]
dev = ["pytest>=8", "pytest-cov", "mypy>=1.10", "ruff>=0.4"]

[project.scripts]
swarmcurator = "swarmcurator.cli:main"

[project.urls]
Homepage = "https://github.com/mbgulden/swarmcurator"
Repository = "https://github.com/mbgulden/swarmcurator.git"
Changelog = "https://github.com/mbgulden/swarmcurator/blob/main/CHANGELOG.md"

[tool.setuptools.package-data]
swarmcurator = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]
